name: Course quality checks

on:
  push:
  pull_request:

jobs:
  validate-course:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python helpers
        run: python -m compileall -q scripts/python

      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/powershell -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              Write-Host "PowerShell parse failure: $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_ }
              $failed = $true
            }
          }

          if ($failed) {
            exit 1
          }

      - name: Validate course structure and local links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          failures = []

          expected = {f"{i:02d}" for i in range(1, 16)}

          day_sets = {
              "lessons": {
                  p.name[4:6]
                  for p in (root / "lessons").glob("day-*.md")
              },
              "labs": {
                  p.name[4:6]
                  for p in (root / "labs").glob("day-*.md")
              },
              "diagrams": {
                  p.name[4:6]
                  for p in (root / "diagrams").glob("day-*.md")
              },
          }

          for folder, actual in day_sets.items():
              if actual != expected:
                  failures.append(
                      f"{folder}: expected days 01-15, got {sorted(actual)}"
                  )

          markdown_roots = [
              root / "README.md",
              root / "lessons",
              root / "labs",
              root / "diagrams",
              root / "reference",
              root / "troubleshooting",
              root / "scripts",
              root / "advanced",
          ]

          markdown_files = []
          for item in markdown_roots:
              if item.is_file():
                  markdown_files.append(item)
              elif item.exists():
                  markdown_files.extend(item.rglob("*.md"))

          link_re = re.compile(r"\[[^\]]+\]\(([^)]+)\)")

          for path in markdown_files:
              text = path.read_text(encoding="utf-8")

              if text.count("~~~") % 2:
                  failures.append(
                      f"{path}: unbalanced triple-tilde fences"
                  )

              for target in link_re.findall(text):
                  target = target.strip()

                  if (
                      not target
                      or target.startswith("#")
                      or target.startswith("http://")
                      or target.startswith("https://")
                      or target.startswith("mailto:")
                  ):
                      continue

                  local = target.split("#", 1)[0]

                  if not local:
                      continue

                  resolved = (path.parent / local).resolve()

                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      failures.append(
                          f"{path}: local link escapes repository: {target}"
                      )
                      continue

                  if not resolved.exists():
                      failures.append(
                          f"{path}: missing local link target: {target}"
                      )

          authoritative = [
              root / "README.md",
              root / "lessons",
              root / "labs",
              root / "diagrams",
              root / "troubleshooting",
              root / "scripts",
              root / "reference" / "15-day-plan.md",
              root / "reference" / "project-intake-checklist.md",
              root / "reference" / "engineer-confidence-checklist.md",
              root / "reference" / "day15-react-java-reference.md",
          ]

          authoritative_files = []
          for item in authoritative:
              if item.is_file():
                  authoritative_files.append(item)
              elif item.exists():
                  authoritative_files.extend(item.rglob("*.md"))

          for path in authoritative_files:
              text = path.read_text(encoding="utf-8")

              if "—" in text:
                  failures.append(f"{path}: contains em dash")

              if re.search(r"\bmental model\b", text, re.I):
                  failures.append(f"{path}: contains prohibited phrase 'mental model'")

              if re.search(r"\bAI\b", text):
                  failures.append(f"{path}: contains standalone 'AI'")

          if failures:
              print("Course quality checks failed:")
              for failure in failures:
                  print(f" - {failure}")
              sys.exit(1)

          print("Course structure, local links, fences, and wording checks passed.")
          PY
