site_name: OAuth & OIDC with Okta
site_description: A 15-day implementation engineering course for OAuth, OIDC, APIs, automation, and troubleshooting with Okta.
site_url: https://tedxharry.github.io/OAuth-OIDC/
repo_url: https://github.com/TedxHarry/OAuth-OIDC
repo_name: TedxHarry/OAuth-OIDC
edit_uri: edit/main/

docs_dir: .site_docs
site_dir: .site_output

theme:
  name: material
  language: en
  icon:
    logo: material/shield-key-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: luxury-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: luxury-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false

plugins:
  - search

hooks:
  - hooks/mermaid_source.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/luxury.css
  - assets/stylesheets/readability-v3.css

extra_javascript:
  - assets/javascripts/course-ui-v3.js
  - assets/javascripts/diagrams-v5.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TedxHarry/OAuth-OIDC
      name: Course repository
  generator: false

copyright: Built for practical OAuth/OIDC implementation engineering.

